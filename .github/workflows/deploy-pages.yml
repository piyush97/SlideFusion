name: Deploy static showcase to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'portfolio-site/**'
      - '.github/workflows/deploy-pages.yml'
      - 'scripts/check-pages-static.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portfolio-site/package-lock.json
      - name: Install showcase dependencies
        working-directory: portfolio-site
        run: npm ci
      - name: Build static showcase
        working-directory: portfolio-site
        run: npm run build
      - name: Verify the static showcase boundary
        run: ./scripts/check-pages-static.sh
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./portfolio-site/dist

  deploy:
    needs: verify-and-upload
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
